<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no">
    <title>师生账号服务助手</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:微软雅黑}
        body{background:#f2f6fc;height:100vh;display:flex;flex-direction:column}
        .top{background:#1967d2;color:#fff;padding:16px;text-align:center;font-size:17px;border-radius:0 0 25px 25px}
        .chat{flex:1;padding:15px;overflow-y:auto}
        .msg{margin:14px 0;display:flex}
        .my{justify-content:flex-end}
        .bot{justify-content:flex-start}
        .con{padding:12px 15px;border-radius:20px;max-width:85%;line-height:1.6;font-size:15px}
        .my .con{background:#1967d2;color:#fff;border-bottom-right-radius:5px}
        .bot .con{background:#fff;border:1px solid #dde5f0;color:#222;border-bottom-left-radius:5px}
        .foot{display:flex;padding:12px;background:#fff;border-top:1px solid #eee;gap:10px}
        #input{flex:1;padding:11px 16px;border:1px solid #ccc;border-radius:25px;outline:none;font-size:15px}
        #send{padding:11px 20px;border:none;background:#1967d2;color:#fff;border-radius:25px;font-size:15px}
    </style>
</head>
<body>
    <div class="top">师生账号问题解答助手</div>
    <div class="chat" id="chatBox">
        <div class="bot msg">
            <div class="con">您好！我专门解答学生端、教师端账号登录、注册、找回密码、入口使用相关问题，直接提问即可</div>
        </div>
    </div>
    <div class="foot">
        <input id="input" placeholder="输入你的问题...">
        <button id="send">发送</button>
    </div>

<script>
let chatBox = document.getElementById('chatBox');
let input = document.getElementById('input');
let send = document.getElementById('send');

// 只包含：登录、账号、密码、注册、端口入口 相关内容
let answerData = [
    {
        key:["学生端登录不了","学生端登陆不得","学生账号登不上"],
        text:"学生端无法登录解决办法：1.确认输入账号和密码没有输错；2.区分学生专属登录入口，不要进错教师端；3.退出页面重新刷新再次登录；4.检查账号是否已经完成注册，未注册账号无法登录。"
    },
    {
        key:["教师端登录不了","教师端登陆不得","教师账号登不上"],
        text:"教师端无法登录解决办法：1.核对教师专属账号与密码，注意数字和字母区分；2.从教师专用入口进入登录页面；3.退出后台重新进入重试；4.确认账号权限已开通，无权限暂时不能登录。"
    },
    {
        key:["忘记学生密码","学生端密码忘了"],
        text:"忘记学生端密码操作指导：在学生登录页面找到忘记密码选项，按照提示填写绑定信息，即可重置新密码，重置完成后使用新密码登录即可。"
    },
    {
        key:["忘记教师密码","教师端密码忘了"],
        text:"忘记教师端密码操作指导：进入教师登录界面，点击忘记密码，填写预留信息进行验证，验证通过就能重新设置登录密码。"
    },
    {
        key:["学生端注册","怎么注册学生账号"],
        text:"学生账号注册流程：打开学生端首页，找到注册按钮，填写个人基础信息，设置专属登录账号与密码，提交完成即可成功注册使用。"
    },
    {
        key:["教师端注册","怎么注册教师账号"],
        text:"教师账号注册流程：进入教师端注册页面，填写对应身份信息，设置登录账号和独立密码，提交审核通过后即可正常登录使用。"
    },
    {
        key:["学生端入口","进入学生端"],
        text:"想要进入学生端，直接点击首页学生专用入口，即可直达学生登录页面，输入自己注册好的账号密码就能进入使用。"
    },
    {
        key:["教师端入口","进入教师端"],
        text:"想要进入教师端，点击首页教师专属入口，跳转到教师登录界面，输入教师账号密码即可进入管理页面。"
    },
    {
        key:["修改学生密码","更改学生密码"],
        text:"修改学生登录密码：成功登录学生端后，找到个人中心设置，选择修改密码，输入旧密码再设置新密码，保存即可完成更改。"
    },
    {
        key:["修改教师密码","更改教师密码"],
        text:"修改教师登录密码：登录教师端后台，进入个人设置页面，找到密码修改功能，验证原密码后设置新密码保存生效。"
    },
    {
        key:["账号错误","账号不对"],
        text:"提示账号错误，请仔细核对账号编号，确认是对应身份账号，学生账号和教师账号不互通，不能互相登录对方端口。"
    },
    {
        key:["密码错误","密码不对"],
        text:"提示密码错误先检查大小写是否输入错误，确认无误依旧无法登录，直接使用忘记密码功能重新设置新密码即可。"
    }
];

function getReply(msg){
    let m = msg.toLowerCase();
    for(let item of answerData){
        for(let word of item.key){
            if(m.includes(word)){
                return item.text;
            }
        }
    }
    return "我可以听懂所有师生端账号相关问题，你可以询问登录问题、注册方法、找回密码、修改密码、端口入口使用等问题，我都会一步步指导你操作。";
}

function sendMsg(){
    let val = input.value.trim();
    if(!val)return;
    chatBox.innerHTML += `<div class="my msg"><div class="con">${val}</div></div>`;
    input.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;
    setTimeout(()=>{
        let res = getReply(val);
        chatBox.innerHTML += `<div class="bot msg"><div class="con">${res}</div></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    },300)
}

send.onclick = sendMsg;
input.onkeydown=e=>{if(e.key==='Enter')sendMsg()}
</script>
</body>
</html>
